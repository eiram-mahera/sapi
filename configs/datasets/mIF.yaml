name: mIF
description: "Multiplexed immunofluorescence images – 256×256 grayscale (mixed uint8/uint16 on disk)"
num_channels: 1
image_dtype: uint8
image_size: [256, 256]
num_samples: 60
modality: fluorescence
staining: mIF

preprocessing: invert  # Layer-A mode (cells dark->bright); see sapi/datasets/cellbindb.py
min_size: 1            # px; models drop smaller predicted instances (run_experiment.py)
pixel_size_um: null    # not stated in source

recommended_models:
  - cellpose_cyto2
  - cellpose_cyto3
  - cellpose_sam
  - stardist_fluo
  - mesmer
