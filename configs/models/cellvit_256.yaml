name: cellvit_256
description: "CellViT-256 — ViT-Small/16 backbone (DINO HIPT pre-training, Hörst et al. 2024)"

# Input: H&E-only model, receives raw RGB H&E.
# Channel adaptation: CellViT is input_channels=3 -> RGB passed through unchanged.
variant: cellvit_256
num_channels: 3
patch_size: 256
num_classes: 6          # nuclei classes: background + 5 PanNuke cell types
num_tissue_classes: 19  # tissue classes: 19 PanNuke tissue types; must match checkpoint

# CellViT provides x40 (0.25 µm/px) and x20 (0.5 µm/px) checkpoints. CellBinDB's
# pixel size isn't stated in its paper, so x20 is used as a judgment call (a 2x
# mismatch costs ~14.5% relative bPQ per the CellViT authors' MoNuSeg ablation).
# Download: https://drive.google.com/uc?export=download&id=1w99U4sxDQgOSuiHMyvS_NYBiz6ozolN2
# Set to your own downloaded checkpoint location below, or override with
# env var: CELLVIT_WEIGHTS
weight_path: null

# AdamW, betas=(0.85,0.95), ExponentialLR(gamma=0.85). LR=3e-4 per Hörst et al.
# (2024) official PanNuke training config (no author fine-tuning LR exists;
# used as-is for reproducibility).
fewshot_finetuning:
  n_epochs: 10
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4

compatible_datasets:
  - HE
  - 10xGenomics_HE
